<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Set a new password for your IITK Athletics account.">
  <title>Reset password — IITK Athletics</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/dark-theme.css" id="theme-stylesheet">
  <link rel="stylesheet" href="../assets/css/athletes.css">
  <script src="../config/supabase-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../assets/js/reset-password.js" defer></script>
</head>
<body class="athletes-page reset-password-page">
  <header class="site-header athletes-header">
    <a class="brand" href="../home/" aria-label="IITK Athletics home">
      <span class="brand-name">IITK <b>ATHLETICS</b></span>
    </a>
    <nav class="athletes-nav" aria-label="Page navigation">
      <a href="../home/">Home</a>
      <a href="../athletes/">Athletes</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true">☼</span>
        <span class="theme-toggle-label">Light mode</span>
      </button>
    </nav>
  </header>

  <main class="athletes-main reset-password-main">
    <section class="athletes-intro">
      <p class="eyebrow"><span></span> ACCOUNT RECOVERY</p>
      <h1>New <em>password.</em></h1>
      <p>Use the secure recovery link sent to your email to choose a new password.</p>
    </section>

    <section class="auth-card" aria-labelledby="reset-password-title">
      <div class="auth-card-heading">
        <p class="eyebrow"><span></span> SECURE ACCOUNT ACCESS</p>
        <h2 id="reset-password-title">Set a new password.</h2>
        <p id="reset-password-description">Verifying your password recovery link…</p>
      </div>
      <form id="reset-password-form" class="login-form" hidden>
        <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required><span class="field-hint">Use at least 8 characters.</span></label>
        <label>Confirm new password<input name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="athletes-primary-button" type="submit">Save new password <span aria-hidden="true">↗</span></button>
      </form>
      <p class="auth-status" id="reset-password-status" role="status" aria-live="polite"></p>
      <a class="admin-return-link" id="admin-signin-link" href="../admin/" hidden>Return to admin sign-in <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> IITK Athletics</p>
  </footer>
</body>
</html>
